<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPW Engineer Portal - Reach & SR Services</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #050b14, #0f172a, #1e1b4b); margin: 0; padding: 20px; color: #f8fafc; min-height: 100vh; }
        .container { max-width: 480px; margin: 30px auto; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(25px); padding: 30px; border-radius: 28px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); border: 1px solid rgba(56,189,248,0.2); }
        .logo-box { text-align: center; margin-bottom: 15px; }
        .logo-box img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #38bdf8; }
        h2 { text-align: center; color: #38bdf8; margin: 0 0 5px 0; font-size: 22px; font-weight: 800; }
        .dev-credit { text-align: center; color: #64748b; font-size: 11px; margin-bottom: 25px; text-transform: uppercase; }
        input, button { width: 100%; padding: 14px 16px; margin: 10px 0; border: none; border-radius: 14px; font-size: 15px; box-sizing: border-box; }
        input { background: rgba(30, 41, 59, 0.9); color: #fff; border: 1px solid rgba(255, 255, 255, 0.12); outline: none; }
        button { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #0f172a; font-weight: 700; cursor: pointer; }
        .pkg-card { background: rgba(30, 41, 59, 0.6); padding: 16px 18px; margin: 14px 0; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255, 255, 255, 0.08); }
        .pkg-card button { width: auto; padding: 8px 18px; margin: 0; background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
        .badge { background: #f59e0b; color: white; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .hidden { display: none !important; }
        .user-box { background: rgba(30, 41, 59, 0.7); padding: 22px; border-radius: 20px; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-box">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Logo">
    </div>
    <h2>JPW ENGINEER PORTAL</h2>
    <div class="dev-credit">Developed by tenaga technology</div>

    <!-- Web Login Screen -->
    <div id="web-login-screen" class="hidden">
        <h3 style="text-align: center; color: #cbd5e1;">Web Login via Telegram ID</h3>
        <a href="https://t.me/JPWREACHSERVICESBOT" target="_blank" style="display: block; background: #2563eb; color: white; text-align: center; padding: 14px; border-radius: 12px; font-weight: bold; text-decoration: none; margin-bottom: 15px;">🤖 Start Telegram Bot & Get ID</a>
        <input type="text" id="webChatIdInput" placeholder="Enter Telegram Chat ID">
        <button onclick="requestOtp()">📩 Send OTP</button>
        <p id="loginMsg" style="color:#f87171; text-align:center; font-weight:bold;"></p>
    </div>

    <!-- OTP Screen -->
    <div id="otp-verify-screen" class="hidden">
        <h3 style="text-align: center; color: #cbd5e1;">Enter Verification OTP</h3>
        <input type="text" id="otpInput" placeholder="Enter 6-digit OTP" maxlength="6" style="text-align: center; font-weight: bold; font-size: 20px;">
        <button onclick="verifyOtp()">🔐 Verify & Login</button>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-screen" class="hidden">
        <div class="user-box">
            <p>👨‍🔧 <b>Engineer:</b> <span id="userName" style="color: #38bdf8;"></span></p>
            <p>🪙 <b>JPW Coins:</b> <span id="userCoins" class="badge">0</span> Coins</p>
            <button onclick="logout()" style="background: #ef4444; color: #fff; width:auto; padding:6px 16px; margin-top:10px;">🚪 Logout</button>
        </div>

        <!-- Switch Tabs (Regular Reach vs SR Service) -->
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button id="tabRegular" onclick="switchTab('regular')" style="flex: 1; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; background: #38bdf8; color: #0f172a; border: none;">⚡ Regular Reach</button>
            <button id="tabSr" onclick="switchTab('sr')" style="flex: 1; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8;">📌 SR Service</button>
        </div>

        <!-- Regular Reach Order Form -->
        <div id="formRegular">
            <h3 style="color: #38bdf8; font-size: 16px; margin-bottom: 10px;">⚡ Submit Regular Reach Order</h3>
            <input type="text" id="targetId" placeholder="Target Username / ID">
            <input type="password" id="targetPass" placeholder="Target Password">
            <button onclick="submitOrder()">🚀 Submit Reach Order (1 Coin)</button>
            <p id="orderMsg" style="text-align:center; font-weight:bold; margin-top: 10px;"></p>
        </div>

        <!-- SR Service Form -->
        <div id="formSr" class="hidden">
            <div style="background: rgba(56, 189, 248, 0.05); border: 1px dashed #38bdf8; padding: 18px; border-radius: 18px;">
                <h3 style="color: #38bdf8; font-size: 16px; margin-top: 0; margin-bottom: 5px;">📌 Create New SR Service</h3>
                <p style="font-size: 12px; color: #94a3b8; margin: 0 0 15px 0;">Cost: <b>1 JPW Coin</b> per submission.</p>
                
                <input type="text" id="srCustomerName" placeholder="Customer Name">
                <input type="text" id="srMobile" placeholder="Customer Registered Mobile Number">
                <input type="text" id="srLandline" placeholder="Customer Landline Number">
                
                <button onclick="submitSrOrder()" style="background: linear-gradient(135deg, #10b981, #059669); margin-top: 10px;">🚀 Submit SR Order</button>
                <p id="srMsg" style="text-align:center; font-weight:bold; margin-top: 10px;"></p>
            </div>
        </div>

        <h3 style="margin-top:25px; color: #38bdf8; font-size: 16px;">📦 Buy JPW Coins Packages</h3>
        <div id="packages-list"></div>
    </div>
</div>

<script>
    let telegramChatId = localStorage.getItem('jpw_chat_id') || '';

    window.addEventListener('DOMContentLoaded', async () => {
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('payment') === 'success') {
            const chatId = urlParams.get('telegramChatId');
            const coins = urlParams.get('coins');
            const orderId = urlParams.get('order_id');
            if (chatId && coins) {
                try {
                    await fetch('/api/verify-instant', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ telegramChatId: chatId, coins, order_id: orderId })
                    });
                    alert(`🎉 Payment Successful! ${coins} JPW Coins added.`);
                } catch(e) {}
                window.location.href = '/';
                return;
            }
        }

        if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
            telegramChatId = String(tg.initDataUnsafe.user.id);
            localStorage.setItem('jpw_chat_id', telegramChatId);
            authenticateMiniApp(telegramChatId, tg.initDataUnsafe.user.first_name || 'Engineer');
        } else if (telegramChatId) {
            authenticateMiniApp(telegramChatId, 'Auto User');
        } else {
            document.getElementById('web-login-screen').classList.remove('hidden');
        }
    });

    function switchTab(type) {
        if(type === 'regular') {
            document.getElementById('formRegular').classList.remove('hidden');
            document.getElementById('formSr').classList.add('hidden');
            document.getElementById('tabRegular').style.background = '#38bdf8';
            document.getElementById('tabRegular').style.color = '#0f172a';
            document.getElementById('tabSr').style.background = '#1e293b';
            document.getElementById('tabSr').style.color = '#38bdf8';
        } else {
            document.getElementById('formRegular').classList.add('hidden');
            document.getElementById('formSr').classList.remove('hidden');
            document.getElementById('tabSr').style.background = '#38bdf8';
            document.getElementById('tabSr').style.color = '#0f172a';
            document.getElementById('tabRegular').style.background = '#1e293b';
            document.getElementById('tabRegular').style.color = '#38bdf8';
        }
    }

    async function authenticateMiniApp(chatId, name) {
        const res = await fetch('/api/mini-app/auth', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ telegramChatId: chatId, name })
        });
        const data = await res.json();
        if(data.success) {
            document.getElementById('web-login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            document.getElementById('userName').innerText = data.user.name;
            document.getElementById('userCoins').innerText = data.user.jpwCoins.toFixed(2);
            loadPackages();
        } else {
            localStorage.removeItem('jpw_chat_id');
            document.getElementById('web-login-screen').classList.remove('hidden');
        }
    }

    async function submitOrder() {
        const targetId = document.getElementById('targetId').value.trim();
        const targetPass = document.getElementById('targetPass').value.trim();
        if(!targetId || !targetPass) return alert('All fields required');

        const res = await fetch('/api/order', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ telegramChatId, targetId, targetPass })
        });
        const data = await res.json();
        const msgTag = document.getElementById('orderMsg');
        msgTag.innerText = data.message;
        msgTag.style.color = data.success ? '#10b981' : '#f87171';
        if(data.success) {
            document.getElementById('targetId').value = '';
            document.getElementById('targetPass').value = '';
            authenticateMiniApp(telegramChatId, document.getElementById('userName').innerText);
        }
    }

    async function submitSrOrder() {
        const customerName = document.getElementById('srCustomerName').value.trim();
        const mobileNumber = document.getElementById('srMobile').value.trim();
        const landlineNumber = document.getElementById('srLandline').value.trim();
        if(!customerName || !mobileNumber || !landlineNumber) return alert('All fields are required!');

        const res = await fetch('/api/sr-submit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ telegramChatId, customerName, mobileNumber, landlineNumber })
        });
        const data = await res.json();
        document.getElementById('srMsg').innerText = data.message;
        document.getElementById('srMsg').style.color = data.success ? '#10b981' : '#f87171';
        if(data.success) {
            document.getElementById('srCustomerName').value = '';
            document.getElementById('srMobile').value = '';
            document.getElementById('srLandline').value = '';
            authenticateMiniApp(telegramChatId, document.getElementById('userName').innerText);
        }
    }

    async function loadPackages() {
        const res = await fetch('/api/packages');
        const data = await res.json();
        let html = '';
        data.packages.forEach(p => {
            html += `<div class="pkg-card">
                <div><span>₹${p.amount} ➡️ <b>${p.coins} Coins</b></span></div>
                <button onclick="buyPkg(${p.amount}, ${p.coins})">Pay</button>
            </div>`;
        });
        document.getElementById('packages-list').innerHTML = html;
    }

    async function buyPkg(amount, coins) {
        const res = await fetch('/api/pay', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ telegramChatId, amount, coins })
        });
        const data = await res.json();
        if(data.success) {
            Cashfree({ mode: "production" }).checkout({
                paymentSessionId: data.paymentSessionId,
                redirectTarget: "_self"
            });
        } else {
            alert('Error: ' + data.message);
        }
    }

    function logout() { localStorage.removeItem('jpw_chat_id'); location.reload(); }

    async function requestOtp() {
        const chatId = document.getElementById('webChatIdInput').value.trim();
        if(!chatId) return alert('Enter Chat ID');
        window.tempChat = chatId;
        await fetch('/api/send-otp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ telegramChatId: chatId }) });
        document.getElementById('web-login-screen').classList.add('hidden');
        document.getElementById('otp-verify-screen').classList.remove('hidden');
    }

    async function verifyOtp() {
        const otp = document.getElementById('otpInput').value.trim();
        const res = await fetch('/api/verify-otp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ telegramChatId: window.tempChat, otp }) });
        const data = await res.json();
        if(data.success) {
            telegramChatId = data.user.telegramChatId;
            localStorage.setItem('jpw_chat_id', telegramChatId);
            document.getElementById('otp-verify-screen').classList.add('hidden');
            authenticateMiniApp(telegramChatId, data.user.name);
        } else { alert(data.message); }
    }
</script>
</body>
</html>
