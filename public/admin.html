<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPW Admin | Premium Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .table-row:hover { background: rgba(56, 189, 248, 0.05); }
    </style>
</head>
<body class="p-6">

<div id="admin-login-box" class="max-w-md mx-auto mt-20 p-8 glass rounded-3xl shadow-2xl text-center">
    <h2 class="text-2xl font-bold text-sky-400 mb-6">👑 Admin Access</h2>
    <input type="password" id="adminPass" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-600 mb-4 text-white" placeholder="Enter Secret PIN">
    <button onclick="adminLogin()" class="w-full py-3 bg-sky-600 hover:bg-sky-500 rounded-xl font-bold">Login Dashboard</button>
</div>

<div id="admin-dashboard" class="hidden max-w-7xl mx-auto">
    <h1 class="text-3xl font-black text-white mb-8 text-center uppercase tracking-widest">JPW Admin Portal</h1>

    <!-- Stats Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="glass p-6 rounded-2xl border-l-4 border-emerald-500">
            <h3 class="text-slate-400">Total Users</h3>
            <p id="totalUsers" class="text-3xl font-bold text-white">0</p>
        </div>
        <div class="glass p-6 rounded-2xl border-l-4 border-sky-500">
            <h3 class="text-slate-400">Pending Orders</h3>
            <p id="pendingOrders" class="text-3xl font-bold text-white">0</p>
        </div>
        <div class="glass p-6 rounded-2xl border-l-4 border-amber-500">
            <h3 class="text-slate-400">Total Revenue Estimate</h3>
            <p id="totalRevenue" class="text-3xl font-bold text-white">₹0</p>
        </div>
    </div>

    <!-- Users Management Table -->
    <div class="glass p-6 rounded-3xl mb-8">
        <h3 class="text-xl font-bold mb-4 text-sky-400">👤 User Coin Management</h3>
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead>
                    <tr class="text-slate-400 border-b border-slate-700">
                        <th class="p-3">User Name</th>
                        <th class="p-3">Chat ID</th>
                        <th class="p-3">Coins Balance</th>
                        <th class="p-3">Actions (Coins)</th>
                        <th class="p-3">Delete</th>
                    </tr>
                </thead>
                <tbody id="users-table"></tbody>
            </table>
        </div>
    </div>

    <!-- Announcements -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="glass p-6 rounded-3xl">
            <h3 class="text-lg font-bold mb-3 text-emerald-400">📢 Global Announcement</h3>
            <textarea id="broadcastMsg" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 mb-2" rows="3"></textarea>
            <button onclick="triggerBroadcast()" class="w-full py-2 bg-emerald-600 rounded-lg font-bold">Broadcast Now</button>
        </div>
        <div class="glass p-6 rounded-3xl">
            <h3 class="text-lg font-bold mb-3 text-rose-400">⚠️ Danger Zone</h3>
            <input type="password" id="clearPin" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 mb-2" placeholder="PIN: 9999">
            <button onclick="clearEntireDatabase()" class="w-full py-2 bg-rose-600 rounded-lg font-bold">Clear All Data</button>
        </div>
    </div>
</div>

<script>
    async function adminLogin() {
        const password = document.getElementById('adminPass').value;
        const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ password })
        });
        const data = await res.json();
        if(data.success) {
            document.getElementById('admin-login-box').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
            loadAdminData();
        } else {
            alert('Wrong Password!');
        }
    }

    async function loadAdminData() {
        const res = await fetch('/api/admin/data');
        const data = await res.json();
        if(!data.success) return;

        // Update Stats
        document.getElementById('totalUsers').innerText = data.users.length;
        document.getElementById('pendingOrders').innerText = data.orders.filter(o => o.status === 'Pending').length;

        // User Table
        let userHtml = '';
        data.users.forEach(usr => {
            userHtml += `<tr class="table-row border-b border-slate-700">
                <td class="p-3">${usr.name}</td>
                <td class="p-3 text-sky-300">${usr.telegramChatId}</td>
                <td class="p-3 font-bold text-amber-400">${usr.jpwCoins.toFixed(2)}</td>
                <td class="p-3 flex gap-2">
                    <button class="bg-emerald-700 px-3 py-1 rounded" onclick="updateCoins('${usr._id}', 'add', 1)">+1</button>
                    <button class="bg-emerald-700 px-3 py-1 rounded" onclick="updateCoins('${usr._id}', 'add', 5)">+5</button>
                    <button class="bg-rose-700 px-3 py-1 rounded" onclick="updateCoins('${usr._id}', 'deduct', 1)">-1</button>
                </td>
                <td class="p-3">
                    <button class="text-rose-500" onclick="deleteUser('${usr._id}')">Delete</button>
                </td>
            </tr>`;
        });
        document.getElementById('users-table').innerHTML = userHtml;
    }

    async function updateCoins(userId, action, count) {
        await fetch('/api/admin/update-reaches', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ userId, action, count })
        });
        loadAdminData();
    }

    async function deleteUser(userId) {
        if(!confirm('Sure?')) return;
        await fetch('/api/admin/delete-user', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ userId })
        });
        loadAdminData();
    }
    
    async function triggerBroadcast() {
        const message = document.getElementById('broadcastMsg').value;
        await fetch('/api/admin/broadcast', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ message })
        });
        alert('Sent!');
    }
</script>
</body>
</html>
