<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPW Engineer Portal - Mobile App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Segoe+UI:wght@400;600;800&display=swap');
        body { background: #030712; color: #f8fafc; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .glass { background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(56, 189, 248, 0.3); }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="p-4 flex items-center justify-center min-h-screen">
<div class="w-full max-w-lg glass p-6 rounded-3xl relative space-y-4">
    <div class="text-center mb-3">
        <h1 class="text-xl font-black text-sky-400 mono">JPW ENGINEER PORTAL</h1>
        <p class="text-xs text-slate-400">Live Status & Management</p>
    </div>

    <!-- User Info Box -->
    <div class="p-4 rounded-xl bg-slate-950 border border-sky-500/30 flex justify-between items-center">
        <div>
            <h3 id="userName" class="font-bold text-sm text-sky-300">Engineer</h3>
            <p id="userChatId" class="text-[10px] text-slate-500 mono"></p>
        </div>
        <div class="text-right">
            <p class="text-[10px] text-slate-400">Balance</p>
            <h2 class="text-lg font-black text-amber-400"><span id="userCoins">0</span> Coins</h2>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-2 gap-2">
        <button onclick="checkOrderStatus()" class="py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-xl text-xs">🔄 Sync Status</button>
        <button onclick="claimBonus()" class="py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs">🎁 Daily Bonus</button>
    </div>

    <!-- Order Status Section -->
    <div class="space-y-2">
        <h4 class="text-xs font-bold text-slate-300 uppercase">📋 Live Orders & Sync History</h4>
        <div id="statusBox" class="max-h-60 overflow-y-auto space-y-2 pr-1">
            <p class="text-center text-xs text-slate-500 py-4">Click 'Sync Status' to load orders.</p>
        </div>
    </div>

    <div class="text-center pt-2">
        <a href="/" class="text-xs text-sky-400 underline">⬅️ Back to Home</a>
    </div>
</div>

<script>
    let activeChatId = localStorage.getItem('jpw_chat_id') || '';

    if(activeChatId) {
        loadMiniAppAuth(activeChatId);
    } else {
        document.getElementById('userName').innerText = 'Guest Engineer';
        document.getElementById('userChatId').innerText = 'Please login via Bot';
    }

    async function loadMiniAppAuth(chatId) {
        try {
            const res = await fetch('/api/mini-app/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegramChatId: chatId })
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('userName').innerText = data.user.name;
                document.getElementById('userChatId').innerText = `ID: ${data.user.telegramChatId}`;
                document.getElementById('userCoins').innerText = data.user.jpwCoins.toFixed(2);
                checkOrderStatus();
            }
        } catch(e) {}
    }

    // 🛠️ Fixed Check Order Status with correct backend endpoint & zero sync error
    async function checkOrderStatus() {
        const telegramChatId = localStorage.getItem('jpw_chat_id');
        if (!telegramChatId) {
            document.getElementById('statusBox').innerHTML = `<p class="text-xs text-rose-400 text-center">Session not found. Please open via Telegram Bot.</p>`;
            return;
        }

        document.getElementById('statusBox').innerHTML = `<p class="text-xs text-sky-400 text-center py-2">Syncing orders...</p>`;

        try {
            const res = await fetch('/api/app/check-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegramChatId })
            });
            const data = await res.json();

            if (data.success) {
                let html = '';
                
                // Render Regular Reach Orders
                if (data.regularOrders && data.regularOrders.length > 0) {
                    data.regularOrders.forEach(o => {
                        const statusColor = o.status === 'Completed' ? 'text-emerald-400 bg-emerald-500/10' : 
                                            o.status === 'Rejected' ? 'text-rose-400 bg-rose-500/10' : 'text-amber-400 bg-amber-500/10';
                        html += `
                        <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs space-y-1">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-cyan-300">🎯 ID: ${o.targetId}</span>
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold ${statusColor}">${o.status}</span>
                            </div>
                            <p class="text-[10px] text-slate-400">Admin/Bot Reply: ${o.adminReply || 'Processing...'}</p>
                            <p class="text-[9px] text-slate-500">${new Date(o.createdAt).toLocaleString()}</p>
                        </div>`;
                    });
                }

                // Render SR Orders if any
                if (data.srOrders && data.srOrders.length > 0) {
                    data.srOrders.forEach(s => {
                        html += `
                        <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs space-y-1">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-fuchsia-300">📌 SR: ${s.customerName}</span>
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold text-amber-400 bg-amber-500/10">${s.status}</span>
                            </div>
                            <p class="text-[10px] text-slate-400">Mobile: ${s.mobileNumber}</p>
                        </div>`;
                    });
                }

                if ((!data.regularOrders || data.regularOrders.length === 0) && (!data.srOrders || data.srOrders.length === 0)) {
                    html = `<p class="text-center text-xs text-slate-500 py-4">No recent orders found.</p>`;
                }

                document.getElementById('statusBox').innerHTML = html;
            } else {
                document.getElementById('statusBox').innerHTML = `<p class="text-xs text-rose-400 text-center">Sync Error: Failed to fetch orders.</p>`;
            }
        } catch (err) {
            document.getElementById('statusBox').innerHTML = `<p class="text-xs text-rose-400 text-center">SYNC ERROR: Network failure.</p>`;
        }
    }

    async function claimBonus() {
        const telegramChatId = localStorage.getItem('jpw_chat_id');
        if(!telegramChatId) return alert('Session not found!');
        try {
            const res = await fetch('/api/claim-daily-bonus', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ telegramChatId })
            });
            const data = await res.json();
            alert(data.message || `Bonus Claimed: +${data.randomBonus} Coins!`);
            if(data.success) loadMiniAppAuth(telegramChatId);
        } catch(e) {
            alert('Error claiming bonus.');
        }
    }
</script>
</body>
</html>
